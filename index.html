<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>AI工具导航</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    padding:20px;
}

/* 顶部 */
.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    font-size:32px;
    font-weight:bold;
    background:linear-gradient(90deg,#00f0ff,#8a2be2);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.desc{
    color:#aaa;
    margin-top:8px;
    font-size:14px;
}

/* 搜索框 */
.search-box{
    margin-top:20px;
}

.search-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#161616;
    color:white;
    font-size:16px;
    outline:none;
    box-shadow:0 0 10px rgba(0,255,255,0.2);
}

/* 分类标题 */
.section-title{
    margin:30px 0 15px;
    font-size:20px;
    font-weight:bold;
    color:#00f0ff;
}

/* 卡片布局 */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* 卡片 */
.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    text-decoration:none;
    color:white;
    transition:0.3s;
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(0,255,255,0.05);
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00f0ff;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

.icon{
    font-size:32px;
    margin-bottom:10px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.info{
    margin-top:8px;
    color:#aaa;
    font-size:13px;
    line-height:1.5;
}

/* 底部 */
.footer{
    margin-top:40px;
    text-align:center;
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<!-- 顶部 -->
<div class="header">
    <div class="logo">AI TOOL NAV</div>
    <div class="desc">全网热门AI工具导航站</div>

    <div class="search-box">
        <input type="text" placeholder="搜索AI工具..." />
    </div>
</div>

<!-- AI聊天 -->
<div class="section-title">AI聊天</div>

<div class="grid">

<a class="card" href="https://chatgpt.com" target="_blank">
    <div class="icon">🤖</div>
    <div class="name">ChatGPT</div>
    <div class="info">OpenAI 官方AI助手</div>
</a>

<a class="card" href="https://kimi.moonshot.cn" target="_blank">
    <div class="icon">🌙</div>
    <div class="name">Kimi</div>
    <div class="info">超长文本AI助手</div>
</a>

<a class="card" href="https://www.doubao.com" target="_blank">
    <div class="icon">🧠</div>
    <div class="name">豆包</div>
    <div class="info">字节跳动AI助手</div>
</a>

<a class="card" href="https://www.deepseek.com" target="_blank">
    <div class="icon">🚀</div>
    <div class="name">DeepSeek</div>
    <div class="info">国产热门AI模型</div>
</a>

</div>

<!-- AI绘画 -->
<div class="section-title">AI绘画</div>

<div class="grid">

<a class="card" href="#">
    <div class="icon">🎨</div>
    <div class="name">Midjourney</div>
    <div class="info">AI图片生成工具</div>
</a>

<a class="card" href="#">
    <div class="icon">🖼️</div>
    <div class="name">Stable Diffusion</div>
    <div class="info">开源AI绘画模型</div>
</a>

</div>

<!-- AI视频 -->
<div class="section-title">AI视频</div>

<div class="grid">

<a class="card" href="#">
    <div class="icon">🎬</div>
    <div class="name">Runway</div>
    <div class="info">AI视频生成平台</div>
</a>

<a class="card" href="#">
    <div class="icon">📹</div>
    <div class="name">Pika</div>
    <div class="info">AI动画视频工具</div>
</a>

</div>

<!-- 底部 -->
<div class="footer">
    © 2026 AI TOOL NAV
</div>

</body>
</html>
