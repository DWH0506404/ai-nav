<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AI UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --cyan:#00e5ff;--purple:#7a5cff;--bg:#060918;--card:#0c0f22;
  --border:rgba(255,255,255,.07);--muted:#5a6a99;--text:#e8eeff;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  position:relative;
}
/* BG */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% -10%,#1a3060 0%,#060918 55%,#000 100%);
}
body::after{
  content:'';position:fixed;top:-100px;left:50%;transform:translateX(-50%);
  width:420px;height:220px;
  background:radial-gradient(ellipse,rgba(0,200,255,.18),transparent 70%);
  z-index:0;pointer-events:none;
}
/* PAGES */
.app{position:relative;z-index:1;flex:1;overflow:hidden;display:flex;flex-direction:column;}
.pages{flex:1;overflow:hidden;position:relative;}
.page{
  position:absolute;inset:0;overflow-y:auto;
  padding:0 14px 90px;
  opacity:0;pointer-events:none;transform:translateX(20px);
  transition:opacity .25s,transform .25s;
  scrollbar-width:none;
}
.page::-webkit-scrollbar{display:none;}
.page.active{opacity:1;pointer-events:all;transform:translateX(0);}
/* HERO */
.hero{text-align:center;padding:28px 0 0;}
.hero h1{
  font-size:44px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,#00e5ff,#b08dff,#00e5ff);
  background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 5s linear infinite;
  filter:drop-shadow(0 0 18px rgba(0,229,255,.4));
}
@keyframes shine{to{background-position:200%;}}
.hero-sub{color:var(--muted);margin-top:6px;font-size:14px;}
.banner{
  margin:16px 0;padding:14px 18px;border-radius:16px;
  background:linear-gradient(90deg,#00b0d8,#7a5cff);
  font-size:14px;font-weight:600;line-height:1.6;
  box-shadow:0 4px 24px rgba(0,180,255,.25);
}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;}
.search-wrap input{
  width:100%;padding:13px 40px 13px 42px;
  border:1.5px solid var(--border);border-radius:14px;
  background:rgba(10,13,30,.9);color:white;font-size:14px;
  font-family:'Poppins',sans-serif;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-wrap input:focus{border-color:rgba(0,229,255,.4);box-shadow:0 0 16px rgba(0,229,255,.1);}
.search-wrap input::placeholder{color:#3d4d72;}
.search-clear{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:none;color:white;
  width:22px;height:22px;border-radius:50%;cursor:pointer;
  font-size:12px;display:none;align-items:center;justify-content:center;
}
.search-clear.show{display:flex;}
/* QUICK */
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.quick button{
  flex:none;border:1px solid var(--border);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.8);padding:8px 14px;border-radius:999px;
  white-space:nowrap;font-size:12.5px;font-family:'Poppins',sans-serif;cursor:pointer;
  transition:.2s;
}
.quick button:hover{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3);}
/* SECTION */
.section{margin-top:28px;}
.section-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.section-hd h2{
  font-size:18px;font-weight:700;display:flex;align-items:center;gap:7px;
}
.section-hd h2::before{
  content:'';display:block;width:3px;height:18px;border-radius:3px;
  background:linear-gradient(180deg,var(--cyan),var(--purple));
  box-shadow:0 0 8px rgba(0,229,255,.5);
}
.more-btn{font-size:12px;color:var(--muted);text-decoration:none;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Poppins',sans-serif;}
/* GRID */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
/* CARD */
.card{
  background:rgba(10,13,28,.95);border:1px solid var(--border);border-radius:18px;
  padding:13px 6px 11px;text-decoration:none;color:white;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  position:relative;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s;
}
.card:active{transform:scale(.96);}
.card:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.2);box-shadow:0 6px 20px rgba(0,229,255,.12);}
.app-icon{
  width:54px;height:54px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:white;position:relative;
}
.card-name{font-size:11.5px;font-weight:600;line-height:1.2;}
.card-desc{font-size:9.5px;color:var(--muted);line-height:1.3;}
/* FAV STAR */
.fav-star{
  position:absolute;top:6px;right:6px;
  font-size:11px;cursor:pointer;z-index:2;
  transition:transform .15s;
}
.fav-star:active{transform:scale(1.4);}
/* ICON COLORS */
.ic-chatgpt{background:linear-gradient(135deg,#10a37f,#0d7a5a);}
.ic-claude{background:linear-gradient(135deg,#d4845a,#a3521e);}
.ic-deepseek{background:linear-gradient(135deg,#1565c0,#0d3d8a);}
.ic-kimi{background:linear-gradient(135deg,#1a1a3e,#2a2a5a);}
.ic-gemini{background:linear-gradient(135deg,#4285f4,#1a5fcc);}
.ic-grok{background:linear-gradient(135deg,#111,#252525);}
.ic-cursor{background:linear-gradient(135deg,#1a1a3e,#252550);}
.ic-copilot{background:linear-gradient(135deg,#111,#1e1e1e);}
.ic-replit{background:linear-gradient(135deg,#f26207,#c44d00);}
.ic-v0{background:linear-gradient(135deg,#111,#1c1c1c);}
.ic-midjourney{background:linear-gradient(135deg,#12122a,#0d0d1e);}
.ic-stable{background:linear-gradient(135deg,#1a237e,#0d1560);}
.ic-canva{background:linear-gradient(135deg,#00c4cc,#0097a7);}
.ic-leonardo{background:linear-gradient(135deg,#1a0a3e,#2d1060);}
.ic-runway{background:linear-gradient(135deg,#00c853,#00701a);}
.ic-pika{background:linear-gradient(135deg,#111,#1a1a2e);}
.ic-capcut{background:linear-gradient(135deg,#111,#222);}
.ic-synthesia{background:linear-gradient(135deg,#0277bd,#01579b);}
.ic-suno{background:linear-gradient(135deg,#7b1fa2,#4a0e82);}
.ic-udio{background:linear-gradient(135deg,#c62828,#8e0000);}
.ic-soundraw{background:linear-gradient(135deg,#00695c,#003d36);}
/* SEARCH RESULTS */
.search-results{display:none;}
.search-results.show{display:block;}
.search-meta{font-size:13px;color:var(--muted);margin-bottom:14px;}
.search-meta span{color:var(--cyan);}
.result-row{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:14px;margin-bottom:10px;
  text-decoration:none;color:white;cursor:pointer;
  transition:.2s;
}
.result-row:hover{border-color:rgba(0,229,255,.2);}
.result-row .app-icon{width:46px;height:46px;border-radius:12px;flex:none;}
.result-row .info{flex:1;}
.result-row .info .rname{font-size:15px;font-weight:600;}
.result-row .info .rdesc{font-size:12px;color:var(--muted);}
.result-row .rfav{font-size:18px;cursor:pointer;padding:4px;}
/* HOT PAGE */
.hot-tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.hot-tabs::-webkit-scrollbar{display:none;}
.hot-tab{
  flex:none;padding:7px 16px;border-radius:999px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--muted);font-size:12px;
  font-family:'Poppins',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap;
}
.hot-tab.active{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.3);color:var(--cyan);}
.hot-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:13px;margin-bottom:10px;
  text-decoration:none;color:white;
  transition:.2s;cursor:pointer;
}
.hot-row:hover{border-color:rgba(0,229,255,.18);}
.rank-num{
  width:26px;font-size:14px;font-weight:800;text-align:center;flex:none;
  color:var(--muted);
}
.rank-num.top{color:var(--cyan);}
.hot-info{flex:1;}
.hot-name{font-size:14px;font-weight:600;}
.hot-desc{font-size:11px;color:var(--muted);}
.hot-heat{font-size:12px;color:#ff6b6b;font-weight:600;display:flex;align-items:center;gap:3px;}
/* FAV PAGE */
.fav-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.fav-count{font-size:13px;color:var(--muted);margin-bottom:16px;}
.fav-count span{color:var(--cyan);}
.clear-btn{
  background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.2);
  color:#ff6b6b;padding:10px;border-radius:14px;
  font-size:13px;font-weight:600;width:100%;margin-top:16px;
  cursor:pointer;font-family:'Poppins',sans-serif;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.clear-btn:hover{background:rgba(255,80,80,.18);}
.fav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.fav-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:14px 8px 11px;text-decoration:none;color:white;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;
  position:relative;transition:.2s;cursor:pointer;
}
.fav-card:hover{border-color:rgba(0,229,255,.2);}
.fav-card .app-icon{width:52px;height:52px;border-radius:14px;}
.fav-heart{
  position:absolute;top:6px;right:8px;font-size:14px;cursor:pointer;
}
.empty-state{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.8;}
/* PROFILE */
.profile-card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:24px;margin-bottom:16px;
}
.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.profile-info h3{font-size:16px;font-weight:700;}
.profile-info p{font-size:12px;color:var(--muted);}
.stats-row{display:flex;gap:0;}
.stat{flex:1;text-align:center;padding:12px 0;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-num{font-size:20px;font-weight:800;color:var(--cyan);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.menu-list{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.menu-item{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;
}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{background:rgba(255,255,255,.03);}
.menu-icon{font-size:18px;width:28px;text-align:center;}
.menu-text{flex:1;font-size:14px;}
.menu-arrow{color:var(--muted);font-size:14px;}
/* BOTTOM NAV */
.bottom-nav{
  position:relative;z-index:10;
  background:rgba(5,8,22,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  flex:none;
}
.nav-btn{
  background:none;border:none;color:#4e5d88;
  font-size:10.5px;font-family:'Poppins',sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;min-width:56px;transition:color .2s;
}
.nav-btn svg{width:22px;height:22px;fill:currentColor;transition:filter .2s;}
.nav-btn.active{color:var(--cyan);}
.nav-btn.active svg{filter:drop-shadow(0 0 5px rgba(0,229,255,.6));}
/* TOAST */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(20,25,50,.95);border:1px solid rgba(0,229,255,.2);
  color:white;padding:10px 20px;border-radius:30px;font-size:13px;
  opacity:0;transition:.3s;z-index:9999;white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
<div class="pages">

<!-- ═══ HOME PAGE ═══ -->
<div class="page active" id="page-home">
  <div class="hero">
    <h1>AI UNIVERSE</h1>
    <p class="hero-sub">全网最全AI工具导航平台</p>
  </div>
  <div class="banner">🚀 收录全球热门AI工具 / AI编程 / AI绘画 / AI视频</div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="搜索 AI 工具...">
    <button class="search-clear" id="searchClear">✕</button>
  </div>

  <div class="quick">
    <button onclick="doSearch('ChatGPT')">🔥 ChatGPT</button>
    <button onclick="doSearch('Claude')">🧠 Claude</button>
    <button onclick="doSearch('Cursor')">💻 Cursor</button>
    <button onclick="doSearch('Midjourney')">🎨 Midjourney</button>
    <button onclick="doSearch('DeepSeek')">🚀 DeepSeek</button>
  </div>

  <!-- Search Results -->
  <div class="search-results" id="searchResults">
    <div class="search-meta" id="searchMeta"></div>
    <div id="searchList"></div>
  </div>

  <!-- Normal Content -->
  <div id="homeNormal">
    <!-- AI聊天 -->
    <div class="section">
      <div class="section-hd"><h2>AI聊天</h2><button class="more-btn">更多 ›</button></div>
      <div class="grid4" id="chatGrid"></div>
    </div>
    <!-- AI编程 -->
    <div class="section">
      <div class="section-hd"><h2>AI编程</h2><button class="more-btn">更多 ›</button></div>
      <div class="grid4" id="codeGrid"></div>
    </div>
    <!-- AI绘画 -->
    <div class="section">
      <div class="section-hd"><h2>AI绘画</h2><button class="more-btn">更多 ›</button></div>
      <div class="grid4" id="drawGrid"></div>
    </div>
    <!-- AI视频 -->
    <div class="section">
      <div class="section-hd"><h2>AI视频</h2><button class="more-btn">更多 ›</button></div>
      <div class="grid4" id="videoGrid"></div>
    </div>
    <!-- AI音乐 -->
    <div class="section">
      <div class="section-hd"><h2>AI音乐</h2><button class="more-btn">更多 ›</button></div>
      <div class="grid3" id="musicGrid"></div>
    </div>
  </div>
</div>

<!-- ═══ HOT PAGE ═══ -->
<div class="page" id="page-hot">
  <div style="padding-top:24px;">
    <h2 style="font-size:22px;font-weight:800;margin-bottom:18px;">🔥 热门工具</h2>
    <div class="hot-tabs" id="hotTabs"></div>
    <div id="hotList"></div>
  </div>
</div>

<!-- ═══ FAV PAGE ═══ -->
<div class="page" id="page-fav">
  <div style="padding-top:24px;">
    <div class="fav-hd">
      <h2 style="font-size:22px;font-weight:800;">⭐ 我的收藏</h2>
    </div>
    <div class="fav-count" id="favCount"></div>
    <div class="fav-grid" id="favGrid"></div>
    <div class="empty-state" id="favEmpty" style="display:none;">
      <div class="big">⭐</div>
      <p>还没有收藏任何工具<br>点击工具右上角的星星来收藏</p>
    </div>
    <button class="clear-btn" id="clearFavBtn" onclick="clearFavorites()">🗑️ 清空收藏</button>
  </div>
</div>

<!-- ═══ PROFILE PAGE ═══ -->
<div class="page" id="page-profile">
  <div style="padding-top:24px;">
    <h2 style="font-size:22px;font-weight:800;margin-bottom:18px;">👤 我的页面</h2>
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar">🌌</div>
        <div class="profile-info">
          <h3>AI Universe 用户</h3>
          <p>欢迎回来！</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="statFav">0</div>
          <div class="stat-label">我的收藏</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statVisit">0</div>
          <div class="stat-label">最近使用</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statHistory">0</div>
          <div class="stat-label">浏览历史</div>
        </div>
      </div>
    </div>
    <div class="menu-list">
      <div class="menu-item"><span class="menu-icon">🕐</span><span class="menu-text">历史记录</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">💬</span><span class="menu-text">意见反馈</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">🔗</span><span class="menu-text">分享给好友</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">ℹ️</span><span class="menu-text">关于我们</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">⚙️</span><span class="menu-text">设置</span><span class="menu-arrow">›</span></div>
    </div>
  </div>
</div>

</div><!-- /pages -->

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="switchPage('home',this)">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>首页
  </button>
  <button class="nav-btn" id="nav-hot" onclick="switchPage('hot',this)">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>热门
  </button>
  <button class="nav-btn" id="nav-fav" onclick="switchPage('fav',this)">
    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21 16.54 13.97 22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>收藏
  </button>
  <button class="nav-btn" id="nav-profile" onclick="switchPage('profile',this)">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>我的
  </button>
</div>
</div><!-- /app -->

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
const TOOLS = [
  // 聊天
  {id:'chatgpt',name:'ChatGPT',desc:'OpenAI 官方AI助手',cat:'chat',icon:'ic-chatgpt',label:'◎',url:'https://chat.openai.com',heat:'98.5w'},
  {id:'claude',name:'Claude',desc:'Anthropic AI助手',cat:'chat',icon:'ic-claude',label:'A',url:'https://claude.ai',heat:'76.3w'},
  {id:'deepseek',name:'DeepSeek',desc:'国产热门AI模型',cat:'chat',icon:'ic-deepseek',label:'◉',url:'https://www.deepseek.com',heat:'65.2w'},
  {id:'kimi',name:'Kimi',desc:'超长文本AI助手',cat:'chat',icon:'ic-kimi',label:'K',url:'https://kimi.moonshot.cn',heat:'54.1w'},
  {id:'gemini',name:'Gemini',desc:'Google AI助手',cat:'chat',icon:'ic-gemini',label:'✦',url:'https://gemini.google.com',heat:'43.7w'},

function saveFavorites(){

// ══════════════════════════════════════════
// BUILD CARD
// ══════════════════════════════════════════
function buildCard(tool, showFav=true){
  const isFav = favorites.includes(tool.id);
  const star = isFav ? '❤️' : '☆';
  return `
    <a class="card" href="${tool.url}" target="_blank" data-id="${tool.id}"
       onclick="trackVisit(event,'${tool.id}')">
      ${showFav ? `<div class="fav-star" data-fav="${tool.id}" onclick="toggleFav(event,'${tool.id}')">${star}</div>` : ''}
      <div class="app-icon ${tool.icon}">${iconSVG(tool)}</div>
      <div class="card-name">${tool.name}</div>
      <div class="card-desc">${tool.desc}</div>
    </a>`;
}

function trackVisit(e, id){
  visitCount++;
  historyCount++;
  saveFavorites();
}

// ══════════════════════════════════════════
// RENDER HOME GRIDS
// ══════════════════════════════════════════
function renderHomeGrids(){
  const cats = {chat:'chatGrid',code:'codeGrid',draw:'drawGrid',video:'videoGrid',music:'musicGrid'};
  for(const [cat, gridId] of Object.entries(cats)){
    const tools = TOOLS.filter(t=>t.cat===cat);
    document.getElementById(gridId).innerHTML = tools.map(t=>buildCard(t)).join('');
  }
}

// ══════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchResults = document.getElementById('searchResults');
const homeNormal = document.getElementById('homeNormal');
const searchList = document.getElementById('searchList');
const searchMeta = document.getElementById('searchMeta');

function doSearch(q){
  searchInput.value = q;
  runSearch(q);
}

function runSearch(q){
  q = q.trim();
  if(!q){
    searchResults.classList.remove('show');
    homeNormal.style.display = '';
    searchClear.classList.remove('show');
    return;
  }
  searchClear.classList.add('show');
  const ql = q.toLowerCase();
  const found = TOOLS.filter(t=>
    t.name.toLowerCase().includes(ql)||
    t.desc.toLowerCase().includes(ql)||
    t.cat.toLowerCase().includes(ql)||
    CAT_LABELS[t.cat].includes(q)
  );
  homeNormal.style.display = 'none';
  searchResults.classList.add('show');
  searchMeta.innerHTML = `找到 <span>${found.length}</span> 个相关工具`;
  searchList.innerHTML = found.map(t=>{
    const isFav = favorites.includes(t.id);
    return `
      <div class="result-row" onclick="openTool('${t.url}','${t.id}')">
        <div class="app-icon ${t.icon}">${iconSVG(t)}</div>
        <div class="info">
          <div class="rname">${t.name}</div>
          <div class="rdesc">${t.desc}</div>
        </div>
        <div class="rfav" data-fav="${t.id}" onclick="toggleFav(event,'${t.id}')">${isFav?'⭐':'☆'}</div>
      </div>`;
  }).join('');
}

function openTool(url, id){
  visitCount++;historyCount++;saveFavorites();
  window.open(url,'_blank');
}

searchInput.addEventListener('input', e=>runSearch(e.target.value));
searchClear.addEventListener('click', ()=>{
  searchInput.value='';
  runSearch('');
  searchInput.focus();
});

// ══════════════════════════════════════════
// FAVORITES
// ══════════════════════════════════════════
function toggleFav(e, id){
  e.preventDefault();e.stopPropagation();
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
    showToast('已取消收藏');
  } else {
    favorites.push(id);
    showToast('收藏成功 ⭐');
  }
  saveFavorites();
  refreshAllStars();
  if(currentPage==='fav') renderFavPage();
  if(currentPage==='profile') updateProfileStats();
  if(currentPage==='home') runSearch(searchInput.value);
}

function refreshAllStars(){
  document.querySelectorAll('[data-fav]').forEach(el=>{
    const id = el.dataset.fav;
    const isFav = favorites.includes(id);
    if(el.classList.contains('rfav')) el.textContent = isFav?'⭐':'☆';
    else if(el.classList.contains('fav-star')) el.textContent = isFav?'❤️':'☆';
    else if(el.classList.contains('fav-heart')) el.textContent = isFav?'❤️':'☆';
  });
}

function clearFavorites(){
  if(favorites.length===0){showToast('收藏为空');return;}
  favorites=[];
  saveFavorites();
  renderFavPage();
  refreshAllStars();
  updateProfileStats();
  showToast('已清空收藏');
}

function renderFavPage(){
  const grid = document.getElementById('favGrid');
  const empty = document.getElementById('favEmpty');
  const countEl = document.getElementById('favCount');
  const clearBtn = document.getElementById('clearFavBtn');
  const favTools = TOOLS.filter(t=>favorites.includes(t.id));
  countEl.innerHTML = `我收藏了 <span>${favTools.length}</span> 个工具`;
  if(favTools.length===0){
    grid.innerHTML='';
    empty.style.display='block';
    clearBtn.style.display='none';
  } else {
    empty.style.display='none';
    clearBtn.style.display='flex';
    grid.innerHTML = favTools.map(t=>`
      <div class="fav-card" onclick="openTool('${t.url}','${t.id}')">
        <div class="fav-heart" data-fav="${t.id}" onclick="toggleFav(event,'${t.id}')">❤️</div>
        <div class="app-icon ${t.icon}">${iconSVG(t)}</div>
        <div class="card-name">${t.name}</div>
        <div class="card-desc">${t.desc}</div>
      </div>`).join('');
  }
}

// ══════════════════════════════════════════
// HOT PAGE
// ══════════════════════════════════════════
function renderHotPage(){
  const tabsEl = document.getElementById('hotTabs');
  tabsEl.innerHTML = HOT_CATS.map(c=>`
    <button class="hot-tab ${c===currentHotCat?'active':''}" onclick="setHotCat('${c}')">${c}</button>
  `).join('');
  renderHotList();
}

function setHotCat(cat){
  currentHotCat = cat;
  renderHotPage();
}

function renderHotList(){
  const catKey = CAT_MAP[currentHotCat];
  let tools = catKey ? TOOLS.filter(t=>t.cat===catKey) : [...TOOLS];
  // sort by heat descending (parse number)
  tools.sort((a,b)=>parseFloat(b.heat)-parseFloat(a.heat));
  const el = document.getElementById('hotList');
  el.innerHTML = tools.map((t,i)=>`
    <div class="hot-row" onclick="openTool('${t.url}','${t.id}')">
      <div class="rank-num ${i<3?'top'}">${i+1}</div>
      <div class="app-icon ${t.icon}" style="width:42px;height:42px;border-radius:12px;flex:none;">${iconSVG(t)}</div>
      <div class="hot-info">
        <div class="hot-name">${t.name}</div>
        <div class="hot-desc">${t.desc}</div>
      </div>
      <div class="hot-heat">🔥 ${t.heat}</div>
    </div>`).join('');
}

// ══════════════════════════════════════════
// PROFILE
// ══════════════════════════════════════════
function updateProfileStats(){
  document.getElementById('statFav').textContent = favorites.length;
  document.getElementById('statVisit').textContent = visitCount;
  document.getElementById('statHistory').textContent = historyCount;
}

// ══════════════════════════════════════════
// PAGE SWITCH
// ══════════════════════════════════════════
function switchPage(name, btn){
  currentPage = name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='fav') renderFavPage();
  if(name==='hot') renderHotPage();
  if(name==='profile') updateProfileStats();
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
renderHomeGrids();
updateProfileStats();
</script>
